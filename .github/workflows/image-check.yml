name: Check share image

# Run by hand to confirm the tracker's runner can draw Discord share images: draws the newest
# first score and attaches it to the run as share-image (download it from the run page).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check out score data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the newest first score
        env:
          ONLY_FIRST_DATA_DIR: data-branch
        run: python -m only_first.shareimg share.png

      - uses: actions/upload-artifact@v4
        with:
          name: share-image
          path: share.png
