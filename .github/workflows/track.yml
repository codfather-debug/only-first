name: Track first scores

# Every 5 minutes GitHub starts this job. While games are live it keeps checking
# every 30 seconds for ~9 minutes, so coverage is continuous even when GitHub
# runs the schedule late. Only one run at a time (see concurrency).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out score data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check games and send alerts
        env:
          ONLY_FIRST_DATA_DIR: data-branch
          ONLY_FIRST_WEBHOOK_URL: ${{ secrets.ONLY_FIRST_WEBHOOK_URL }}
        run: python -m only_first update --for-minutes 9

      - name: Save score data
        working-directory: data-branch
        run: |
          git config user.name "only-first-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Update first scores"
          git push
