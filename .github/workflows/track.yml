name: Track first scores

# Each run checks for ~9 minutes (every 30 s while a game is live, every 2 min
# otherwise), then starts the next run itself. GitHub's schedule is unreliable
# (on Nov 26, 2026 it fired once in 90 minutes and missed a first TD), so the
# schedule below is only a backup that restarts the relay if it ever breaks.
# Only one run at a time, and GitHub keeps at most one waiting (see concurrency),
# so extra starts collapse into one. To stop the tracker, disable this workflow
# (cancelling the running run also stops the relay until the schedule restarts it).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # to start the next run

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out score data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check games and send alerts
        env:
          ONLY_FIRST_DATA_DIR: data-branch
          ONLY_FIRST_WEBHOOK_URL: ${{ secrets.ONLY_FIRST_WEBHOOK_URL }}
        run: python -m only_first update --for-minutes 9 --stay

      - name: Save score data
        working-directory: data-branch
        run: |
          git config user.name "only-first-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Update first scores"
          git push

      - name: Start the next run
        # Even if a step above failed, so one bad run doesn't stop the tracker.
        # Not when cancelled: cancelling a run is how to pause the relay.
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run track.yml --ref main
