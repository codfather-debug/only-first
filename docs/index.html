<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Only First</title>
<meta name="description" content="Who scored first in every NBA, NHL and NFL game, and how.">
<meta name="theme-color" content="#12151c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Only First">
<meta property="og:title" content="Only First">
<meta property="og:description" content="Who scored first in every NBA, NHL and NFL game, and how.">
<meta property="og:image" content="https://codfather-debug.github.io/only-first/icons/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="#latest" aria-label="Only First home">
      <span id="brand-mark"></span>
      <span class="brand-name">Only First</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#latest" data-view="latest">Latest</a>
      <a href="#teams" data-view="teams">My teams</a>
      <a href="#stats" data-view="stats">Stats</a>
    </nav>
  </div>
  <div class="wrap filter-row">
    <div class="chips" role="group" aria-label="Filter games">
      <button data-league="all" aria-pressed="true">All</button>
      <button data-league="nba" aria-pressed="false"><span class="emo" aria-hidden="true">🏀 </span>NBA</button>
      <button data-league="nhl" aria-pressed="false"><span class="emo" aria-hidden="true">🏒 </span>NHL</button>
      <button data-league="nfl" aria-pressed="false"><span class="emo" aria-hidden="true">🏈 </span>NFL</button>
      <button id="mine-only" class="mine-chip" aria-pressed="false" title="Show only the teams you follow">★ My teams</button>
    </div>
    <button class="install" id="install">Install app</button>
  </div>
</header>

<main class="wrap">
  <section id="view-latest" class="view" hidden></section>
  <section id="view-teams" class="view" hidden></section>
  <section id="view-stats" class="view" hidden></section>
  <p id="status" class="status" role="status"></p>
</main>

<footer class="wrap foot">
  <p>NBA tracks the first points, NHL the first goal, NFL the first touchdown. Data comes from ESPN's public feeds and is checked every few minutes.
  <span id="updated"></span></p>
</footer>
<div id="tip" class="tip-box" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="brand.js"></script>
<script>document.getElementById("brand-mark").outerHTML = window.OFBrand.mark(34);</script>
<script src="maps.js"></script>
<script src="share.js"></script>
<script src="app.js"></script>
</body>
</html>
